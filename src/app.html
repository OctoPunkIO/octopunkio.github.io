<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/octopunk-icon-glow.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="alternate" type="application/atom+xml" title="Octopunk Blog" href="/atom.xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<!-- Async, non-render-blocking font load. The Google Fonts URL already
		     ships font-display: swap so system fonts render first, then
		     Audiowide swaps in once available. -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
			onload="this.onload=null;this.rel='stylesheet'"
		>
		<noscript>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap">
		</noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
